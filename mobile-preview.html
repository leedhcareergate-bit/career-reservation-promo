<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>모바일 시안 · 취업 자료 예약</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#171918;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.03em}.preview{min-height:100vh;padding:58px 24px 80px;display:flex;flex-direction:column;align-items:center}.head{width:min(720px,100%);text-align:center;margin-bottom:32px}.head span{font-size:12px;font-weight:900;letter-spacing:.12em;color:#078d86}.head h1{font-size:36px;margin:12px 0 10px}.head p{margin:0;color:#66706d;line-height:1.65}.device{width:430px;max-width:100%;padding:18px;background:#171918;border-radius:42px;box-shadow:18px 22px 0 rgba(23,25,24,.18)}.speaker{width:76px;height:7px;background:#555;border-radius:999px;margin:0 auto 12px}.screen{width:390px;max-width:100%;height:844px;border:0;border-radius:25px;background:#fff;display:block}.note{margin-top:28px;font-size:13px;color:#66706d}.note b{color:#171918}@media(max-width:480px){.preview{padding:28px 10px 45px}.head h1{font-size:29px}.device{padding:10px;border-radius:30px}.screen{height:760px;border-radius:21px}.speaker{margin-bottom:8px}}
  </style>
</head>
<body>
  <main class="preview">
    <div class="head"><span>MOBILE · 390px</span><h1>모바일 반응형 시안</h1><p>아래 화면 안에서 직접 스크롤하며<br>전체 페이지와 인터랙션을 확인할 수 있어요.</p></div>
    <div class="device"><div class="speaker"></div><iframe class="screen" src="index.html" title="취업 자료 예약 페이지 모바일 시안"></iframe></div>
    <p class="note"><b>기준 화면:</b> iPhone 14 계열 390 × 844px</p>
  </main>
</body>
</html>
